[package]
name = "riftwarden-gateway"
description = "The Riftwarden backend: the only public service (HTTP + WebSocket), see docs/architecture-v2.md."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
redis = { version = "1.8.2", features = ["tokio-comp", "connection-manager"] }
riftwarden-db = { path = "../db" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
