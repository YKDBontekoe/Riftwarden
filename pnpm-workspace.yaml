packages:
  - packages/*
  - apps/*

# One version of every shared dependency across the workspace.
catalog:
  '@babylonjs/core': ^8.56.2
  '@babylonjs/havok': ^1.3.14
  '@babylonjs/loaders': 8.56.2
  react: ^19.2.0
  react-dom: ^19.2.0
  '@types/react': ^19.2.2
  '@types/react-dom': ^19.2.1
  '@types/node': ^26.6.6
  pg: ^8.23.1
  '@types/pg': ^8.23.1
  ws: ^8.23.0
  '@types/ws': ^8.18.2
  tsx: ^4.23.15
  esbuild: ^0.28.2
  postcss: ^8.5.33
  typescript: '5.9'
  vite: ^7.3.8
  vitest: ^5.1.1
  '@vitejs/plugin-react': ^5.2.0
  tailwindcss: ^4.3.4
  '@tailwindcss/vite': ^4.3.4
  '@preact/signals-core': ^1.14.0
  '@tanstack/react-router': ^1.170.0
  '@bufbuild/protobuf': ^2.17.0
  '@bufbuild/protoc-gen-es': ^2.17.0
  '@bufbuild/buf': ^1.75.0

# Never run install scripts (the old npm ci used --ignore-scripts); esbuild works from its platform package.
ignoredBuiltDependencies:
  - esbuild
