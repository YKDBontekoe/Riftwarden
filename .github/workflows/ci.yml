name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        run: printf '%s\n' "$GITHUB_SHA" > dist/build.txt
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riftwarden-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://riftwarden.ykdbonte.dev
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/ykdbontekoe/riftwarden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riftwarden-build
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and smoke-test the image
        run: |
          docker build --file deploy/Dockerfile --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$GITHUB_SHA" .
          container=$(docker run --detach --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --volume /var/lib/riftwarden --publish 127.0.0.1::8080 "$IMAGE:$GITHUB_SHA")
          trap 'docker rm --force --volumes "$container" >/dev/null 2>&1 || true' EXIT
          address=$(docker port "$container" 8080/tcp)
          if ! curl --fail --silent --show-error --max-time 3 --retry 10 --retry-all-errors --retry-delay 1 "http://$address/health"; then
            docker logs "$container"
            exit 1
          fi
          node scripts/smoke-coop.mjs "http://$address" "$GITHUB_SHA"
      - name: Publish the current main build
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit is available. Skipping this deployment.'
            exit 0
          fi

          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker push "$IMAGE:$GITHUB_SHA"
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:production"
          docker push "$IMAGE:production"
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Verify the live build through Cloudflare
        if: steps.publish.outputs.published == 'true'
        run: |
          for ((attempt = 1; attempt <= 24; attempt++)); do
            if live=$(curl --fail --silent --max-time 5 "https://riftwarden.ykdbonte.dev/build.txt") && [[ "$live" == "$GITHUB_SHA" ]]; then
              if node scripts/smoke-coop.mjs https://riftwarden.ykdbonte.dev "$GITHUB_SHA"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "The production hostname did not pass the co-op smoke test for $GITHUB_SHA in time." >&2
          exit 1
