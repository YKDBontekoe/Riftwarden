name: CI

on:
  # Validate stacked PRs as well as PRs that directly target main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: riftwarden
          POSTGRES_USER: riftwarden
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U riftwarden -d riftwarden"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Protocol schema is linted and the generated TypeScript is current
        run: |
          pnpm exec buf lint proto
          pnpm exec buf generate proto --template proto/buf.gen.yaml
          git diff --exit-code packages/protocol/src/gen
      - run: pnpm lint
      - run: pnpm test
        env:
          RIFT_TEST_DATABASE_URL: postgresql://riftwarden:test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/riftwarden
      - run: pnpm build
        env:
          # The production client talks to the gateway on its own host (Cloudflare Pages serves the client).
          VITE_API_URL: ${{ github.ref == 'refs/heads/main' && 'https://api.riftwarden.ykdbonte.dev' || '' }}
      - if: github.ref == 'refs/heads/main'
        name: Stamp the release version and commit
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/build.txt
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error("Use a major.minor.patch release version in package.json");
            }
            writeFileSync("dist/version.json", JSON.stringify({ version, commit: process.env.GITHUB_SHA }) + "\n");
          '
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: riftwarden-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: riftwarden
          POSTGRES_USER: riftwarden
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U riftwarden -d riftwarden"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version; rustup on the runner installs it.
      - run: rustup show active-toolchain || rustup toolchain install
      # The sync tests start the TypeScript rules worker (apps/worker).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
        env:
          RIFT_TEST_DATABASE_URL: postgresql://riftwarden:test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/riftwarden
          RIFT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
      # Co-op through the real stack (scripts/lib/stack.mjs: fresh database, rules + sim workers, gateway).
      - name: Co-op protocol suites
        run: |
          node --import tsx scripts/e2e-coop-protocol.mjs
          node --import tsx scripts/e2e-coop-map.mjs
        env:
          RIFT_TEST_DATABASE_URL: postgresql://riftwarden:test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/riftwarden
          RIFT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}

  e2e:
    name: Browser suites (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [accounts-and-sync, run-map, construction-and-coop]
    # Playwright 1.55 supports Ubuntu 24.04, while ubuntu-latest now uses 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: riftwarden
          POSTGRES_USER: riftwarden
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U riftwarden -d riftwarden"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:8
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      E2E_OUT: e2e-out
    steps:
      - name: Export test service URLs
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          {
            printf 'RIFT_TEST_DATABASE_URL=postgresql://riftwarden:test-only@127.0.0.1:%s/riftwarden\n' "$POSTGRES_PORT"
            printf 'RIFT_TEST_REDIS_URL=redis://127.0.0.1:%s\n' "$REDIS_PORT"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile && mkdir -p e2e-out
      # The suites require('playwright') (preinstalled in development containers; global here).
      - name: Playwright
        run: |
          npm install --global playwright@1.55.0
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root --global)" >> "$GITHUB_ENV"
      # WebGPU shaders compile with the browser's WGSL compiler (headless cannot present WebGPU frames).
      - if: matrix.suite == 'accounts-and-sync'
        run: node --import tsx scripts/check-wgsl.mjs
      - if: matrix.suite == 'accounts-and-sync'
        run: node --import tsx scripts/with-stack.mjs node scripts/e2e-accounts.cjs
      - if: matrix.suite == 'accounts-and-sync'
        run: node --import tsx scripts/with-stack.mjs node scripts/e2e-sync.cjs
      - if: matrix.suite == 'run-map'
        run: node --import tsx scripts/with-stack.mjs node scripts/e2e-runmap.cjs
      # Section X starts its own stack on :8090; it only needs the dev server.
      - if: matrix.suite == 'construction-and-coop'
        run: node --import tsx scripts/with-stack.mjs --vite-only node --import tsx scripts/e2e-construction-coop.cjs X
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.suite }}
          path: e2e-out/
          if-no-files-found: ignore
          retention-days: 7

  browser-checks:
    name: Browser checks
    # A newer PR commit can cancel the run. Still report failures from completed suites.
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          BROWSER_RESULT: ${{ needs.e2e.result }}
        run: |
          if [[ "$BROWSER_RESULT" != success ]]; then
            echo "::error::Browser suites concluded with: $BROWSER_RESULT"
            exit 1
          fi

  deploy:
    name: Deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'YKDBontekoe' &&
      github.triggering_actor == 'YKDBontekoe'
    needs: [build-and-test, rust, browser-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://riftwarden.ykdbonte.dev
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/ykdbontekoe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: riftwarden-build
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the images
        run: |
          version=$(node -p "require('./dist/version.json').version")
          test "$(node -p "require('./dist/version.json').commit")" = "$GITHUB_SHA"
          for image in gateway worker; do
            docker build --file "deploy/$image.Dockerfile" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$version" \
              --tag "$REGISTRY/riftwarden-$image:$GITHUB_SHA" .
          done
      - name: Smoke-test the stack
        run: |
          cd deploy
          { echo "RIFT_POSTGRES_PASSWORD=$(openssl rand -hex 24)"; echo RIFT_COOKIE_SECURE=0; echo RIFT_TRUST_CF_IP=0; } > .env
          { echo "RIFT_GATEWAY_IMAGE=$REGISTRY/riftwarden-gateway:$GITHUB_SHA"; echo "RIFT_BUILD=$GITHUB_SHA"
            for k in RULES SIM_BLUE SIM_GREEN; do echo "RIFT_${k}_IMAGE=$REGISTRY/riftwarden-worker:$GITHUB_SHA"; done; } > images.env
          compose=(docker compose --env-file .env --env-file images.env -f compose.yml)
          trap '"${compose[@]}" down --volumes >/dev/null 2>&1 || true' EXIT
          if ! "${compose[@]}" up --detach --wait --wait-timeout 120; then "${compose[@]}" logs --tail 80; exit 1; fi
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:18084/health | grep -q '"sims":2' && break; sleep 2; done
          node ../scripts/smoke-stack.mjs http://127.0.0.1:18084 "$GITHUB_SHA"
          docker exec riftwarden-gateway /usr/local/bin/riftwarden-gateway admin status
      - name: Publish the images
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit is available. Skipping this deployment.'
            exit 0
          fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          for image in gateway worker; do
            docker push "$REGISTRY/riftwarden-$image:$GITHUB_SHA"
            docker tag "$REGISTRY/riftwarden-$image:$GITHUB_SHA" "$REGISTRY/riftwarden-$image:production"
            docker push "$REGISTRY/riftwarden-$image:production"
          done
          echo 'published=true' >> "$GITHUB_OUTPUT"
      # The server's deploy timer pulls the images (deploy/deploy.sh drains co-op); wait for the new build.
      - name: Verify the live API
        if: steps.publish.outputs.published == 'true'
        run: |
          for ((attempt = 1; attempt <= 60; attempt++)); do
            if node scripts/smoke-stack.mjs https://api.riftwarden.ykdbonte.dev "$GITHUB_SHA"; then exit 0; fi
            sleep 15
          done
          echo "api.riftwarden.ykdbonte.dev did not serve $GITHUB_SHA in time." >&2
          exit 1
      # Static client on Cloudflare Pages, after the API it calls is live (needs the CLOUDFLARE_API_TOKEN and
      # CLOUDFLARE_ACCOUNT_ID secrets; skipped until they exist).
      - name: Publish the client to Cloudflare Pages
        if: steps.publish.outputs.published == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set: the client was not published.'
            exit 0
          fi
          npx --yes wrangler@4.40.0 pages deploy dist --project-name riftwarden --branch main --commit-hash "$GITHUB_SHA"
          for ((attempt = 1; attempt <= 24; attempt++)); do
            if [[ "$(curl --fail --silent --max-time 5 https://riftwarden.ykdbonte.dev/build.txt)" == "$GITHUB_SHA" ]]; then exit 0; fi
            sleep 10
          done
          echo "riftwarden.ykdbonte.dev did not serve $GITHUB_SHA in time." >&2
          exit 1
