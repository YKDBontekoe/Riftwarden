name: Desktop release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'YKDBontekoe') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: release
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            deploy=$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/jobs" --paginate --jq '.jobs[] | select(.name == "Deploy to production") | .conclusion')
            if [[ "$deploy" != success ]]; then
              echo 'Production deployment did not run successfully; skipping desktop release.'
              exit 0
            fi
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(curl -fsS https://riftwarden.ykdbonte.dev/build.txt)" = "$EXPECTED_SHA"
          test "$(curl -fsS https://riftwarden-api.ykdbonte.dev/health | node -p 'JSON.parse(require("fs").readFileSync(0)).build')" = "$EXPECTED_SHA"
          version=$(node - "$RELEASE_NUMBER" <<'NODE'
          const base = require('./package.json').version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(base)) throw Error('Invalid base version');
          const [major, minor, patch] = base.split('.').map(Number);
          const build = Number(process.argv[2]);
          if (!Number.isSafeInteger(build) || build < 1 || patch + build > 65535) throw Error('Desktop version exceeds the Windows version limit');
          console.log(`${major}.${minor}.${patch + build}`);
          NODE
          )
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          refs=$(git ls-remote origin "refs/tags/v$version" "refs/tags/v$version^{}")
          existing=$(printf '%s\n' "$refs" | awk '/\^\{\}$/ { peeled=$1; next } NF { tag=$1 } END { print peeled ? peeled : tag }')
          if [[ -n "$existing" && "$existing" != "$EXPECTED_SHA" ]]; then
            echo 'The release tag points to a different commit.' >&2
            exit 1
          fi
          draft=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == false ]]; then
            echo 'This release is already published. Bump the version first.' >&2
            exit 1
          fi
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          node - "$version" "$latest" <<'NODE'
          const current = process.argv[2].split('.').map(Number);
          const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(process.argv[3]);
          if (match) {
            const previous = match.slice(1).map(Number);
            const firstDifference = current.findIndex((part, index) => part !== previous[index]);
            if (firstDifference < 0 || current[firstDifference] < previous[firstDifference]) {
              throw new Error('The desktop release version must be newer than the latest release');
            }
          }
          NODE
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.97'
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Set desktop version
        shell: bash
        env:
          DESKTOP_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync("package.json")); p.version = process.env.DESKTOP_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'
      - name: Check updater signing key
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$UPDATER_KEY"
      - uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos-latest' && '-' || '' }}
          VITE_API_URL: https://riftwarden-api.ykdbonte.dev
        with:
          projectPath: apps/client
          tagName: v__VERSION__
          releaseName: Riftwarden v__VERSION__
          releaseDraft: true
          uploadWorkflowArtifacts: true
          prerelease: false
          args: ${{ matrix.args }}
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          EXPECTED_SHA: ${{ needs.verify.outputs.commit }}
        run: |
          test "$(curl -fsS https://riftwarden.ykdbonte.dev/build.txt)" = "$EXPECTED_SHA"
          test "$(curl -fsS https://riftwarden-api.ykdbonte.dev/health | node -p 'JSON.parse(require("fs").readFileSync(0)).build')" = "$EXPECTED_SHA"
          mkdir release
          gh release download "v$VERSION" --dir release
          node - "$VERSION" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync('release/latest.json', 'utf8'));
          for (const target of ['windows-x86_64', 'darwin-x86_64', 'darwin-aarch64']) {
            if (!manifest.platforms[target]?.url || !manifest.platforms[target]?.signature) throw Error(`Missing ${target}`);
          }
          if (manifest.version !== version) throw Error('Incorrect release version');
          const files = fs.readdirSync('release');
          if (!files.some(f => f.endsWith('-setup.exe')) || !files.some(f => f.endsWith('.dmg'))) throw Error('Missing installer');
          NODE
          gh release edit "v$VERSION" --draft=false --latest
