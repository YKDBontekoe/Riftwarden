map $uri $riftwarden_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
    /build.txt  "no-store";
}

server {
    listen 8080;
    server_name _;
    root /srv/riftwarden;
    server_tokens off;

    add_header Cache-Control $riftwarden_cache_control;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }
}
