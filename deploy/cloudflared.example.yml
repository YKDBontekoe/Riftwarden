# ~/.cloudflared/riftwarden.yml on the server (riftwarden-tunnel.service). The client is on Cloudflare Pages, so the
# tunnel only publishes the API.
tunnel: riftwarden
credentials-file: /home/USER/.cloudflared/riftwarden.json
ingress:
  - hostname: riftwarden-api.ykdbonte.dev
    service: http://127.0.0.1:18084
  - service: http_status:404
