# Riftwarden backend on the personal server (docs/architecture-v2.md sections 9-10). The static client is on
# Cloudflare Pages; cloudflared publishes the gateway (api.) and Grafana (grafana., behind Cloudflare Access).
# Images are pinned by digest in images.env, written by deploy.sh (one per sim slot, so slots roll one at a time).
# Memory budget: ~3.3 GB of the 4 GB allocated to the stack.
name: riftwarden

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

x-worker: &worker
  <<: *hardening
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  # SIGTERM: a sim worker ends its operations (secured rewards stay) before exiting.
  stop_grace_period: 40s

services:
  gateway:
    <<: *hardening
    image: ${RIFT_GATEWAY_IMAGE:?deploy.sh selects the image digest}
    container_name: riftwarden-gateway
    environment:
      DATABASE_URL: postgres://riftwarden:${RIFT_POSTGRES_PASSWORD:?Set RIFT_POSTGRES_PASSWORD in .env}@db/riftwarden
      REDIS_URL: redis://redis:6379
      RIFT_BUILD: ${RIFT_BUILD:-unknown}
      RIFT_RP_ID: ${RIFT_RP_ID:-riftwarden.ykdbonte.dev}
      RIFT_CLIENT_ORIGINS: ${RIFT_CLIENT_ORIGINS:-https://riftwarden.ykdbonte.dev}
      RIFT_COOKIE_SECURE: ${RIFT_COOKIE_SECURE:-1}
      RIFT_TRUST_CF_IP: ${RIFT_TRUST_CF_IP:-1}
      RIFT_RULES_WORKERS: rules:7101
      RIFT_SIM_WORKERS: sim-blue:7201,sim-green:7201
      RIFT_DB_POOL: "12"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:18084:8080"
    stop_grace_period: 15s
    mem_limit: 128m

  rules:
    <<: *worker
    image: ${RIFT_RULES_IMAGE:?deploy.sh selects the image digest}
    environment:
      RIFT_WORKER_ROLE: rules
      RIFT_WORKER_LISTEN: 0.0.0.0:7101
      RIFT_BUILD: ${RIFT_BUILD:-unknown}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m

  sim-blue:
    <<: *worker
    image: ${RIFT_SIM_BLUE_IMAGE:?deploy.sh selects the image digest}
    environment: &sim-env
      RIFT_WORKER_ROLE: sim
      RIFT_WORKER_LISTEN: 0.0.0.0:7201
      RIFT_SIM_CAPACITY: "6"
      RIFT_BUILD: ${RIFT_BUILD:-unknown}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_OPTIONS: --max-old-space-size=420
    mem_limit: 512m

  sim-green:
    <<: *worker
    image: ${RIFT_SIM_GREEN_IMAGE:?deploy.sh selects the image digest}
    environment: *sim-env
    mem_limit: 512m

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: riftwarden
      POSTGRES_USER: riftwarden
      POSTGRES_PASSWORD: ${RIFT_POSTGRES_PASSWORD:?Set RIFT_POSTGRES_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, work_mem=4MB]
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "riftwarden", "-d", "riftwarden"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 512m

  # Ceremonies, session cache, rate limits: nothing here needs to survive a restart.
  redis:
    image: redis:8-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 96m

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: ${RIFT_CLICKHOUSE_PASSWORD:?Set RIFT_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1g

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: [--config=/etc/otelcol/config.yml]
    environment:
      RIFT_CLICKHOUSE_PASSWORD: ${RIFT_CLICKHOUSE_PASSWORD:?Set RIFT_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
    depends_on:
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SERVER_ROOT_URL: ${RIFT_GRAFANA_URL:-https://grafana.riftwarden.ykdbonte.dev}
      GF_SECURITY_ADMIN_PASSWORD: ${RIFT_GRAFANA_PASSWORD:?Set RIFT_GRAFANA_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      RIFT_CLICKHOUSE_PASSWORD: ${RIFT_CLICKHOUSE_PASSWORD:?Set RIFT_CLICKHOUSE_PASSWORD in .env}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse: { condition: service_healthy }
    ports:
      - "127.0.0.1:18085:3000"
    restart: unless-stopped
    mem_limit: 192m

volumes:
  postgres:
  clickhouse:
  grafana:
