apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: otel
      defaultDatabase: otel
      logs:
        defaultTable: otel_logs
        otelEnabled: true
      traces:
        defaultTable: otel_traces
        otelEnabled: true
    secureJsonData:
      password: $RIFT_CLICKHOUSE_PASSWORD
