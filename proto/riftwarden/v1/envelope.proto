syntax = "proto3";

package riftwarden.v1;

import "riftwarden/v1/common.proto";
import "riftwarden/v1/coop.proto";
import "riftwarden/v1/events.proto";
import "riftwarden/v1/lobby.proto";
import "riftwarden/v1/snapshot.proto";

// One binary WebSocket frame = one ClientFrame or ServerFrame.

message ClientFrame {
  oneof msg {
    Hello hello = 1;
    LobbyCreate create = 2;
    LobbyJoin join = 3;
    LobbyLeave leave = 4;
    LobbyReady ready = 5;
    LobbyTier tier = 6;
    LobbyMode mode = 7;
    LobbyNode node = 8;
    LobbyStart start = 9;
    ProfileInit profile_init = 10;
    ProfileOp op = 11;
    Presence presence = 12;
    Visit visit = 13;
    Input input = 14;
    Act act = 15;
    Ping ping = 16;
  }
}

message ServerFrame {
  oneof msg {
    Welcome welcome = 1;
    Error error = 2;
    LobbyUpdate lobby = 3;
    ProfileState profile = 4;
    OpResult op_result = 5;
    PresenceState presence = 6;
    HostHq host_hq = 7;
    RunStart run_start = 8;
    Snapshot snap = 9;
    EventBatch events = 10;
    ActResult act_result = 11;
    RunEnd run_end = 12;
    Pong pong = 13;
  }
}

message Hello {
  uint32 protocol = 1;
  string secret = 2;
  string name = 3;
}

message Welcome {
  uint32 protocol = 1;
  string player_id = 2;
  string name = 3;
  bool has_profile = 4;
  Doc profile = 5;
}

message ProfileInit {}

// A named profile operation (progression/ops.ts); args are JSON (their shapes are owned by the rules).
message ProfileOp {
  string name = 1;
  Doc args = 2;
  string tx = 3;
}

message OpResult {
  string tx = 1;
  bool ok = 2;
  string reason = 3;
}

message ProfileState {
  Doc save = 1;
}

message Presence {
  Vec3 p = 1;
  double yaw = 2;
}

message PresencePlayer {
  string id = 1;
  string name = 2;
  Vec3 p = 3;
  double yaw = 4;
}

message PresenceState {
  repeated PresencePlayer players = 1;
}

message Visit {
  bool on = 1;
}

message HostHq {
  string owner = 1;
  Doc base = 2;
}

// Absent lobby = not in a session.
message LobbyUpdate {
  LobbyState lobby = 1;
}

message EventBatch {
  repeated Event events = 1;
}

message Ping {
  double c = 1;
}

message Pong {
  double c = 1;
  double s = 2;
}
